<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b7b">
<meta name="description" content="Jeu de plateau de colonisation en ligne : le plateau sur l'écran, chaque joueur avec sa main sur son téléphone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%230e6b7b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fffaf0'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Au temps béni des colonies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Disposition : plateau à gauche (sticky), colonne de jeu à droite ; sur mobile la main passe avant le plateau. */
:root {
  --bg: #e9eff1;
  --surface: #ffffff;
  --surface-2: #f1f6f7;
  --ink: #14232b;
  --muted: #566972;
  --line: #cdd8dc;
  --accent: #0e6b7b;
  --accent-ink: #ffffff;
  --accent-soft: #d6eaee;
  --sea: #b9d6dd;
  --sea-edge: #93bcc6;
  --pier: #6b5a43;
  --good: #2e8b57;
  --warn: #b87100;
  --bad: #c2402d;
  --shadow: 0 1px 2px rgba(10, 30, 40, .08), 0 8px 22px rgba(10, 30, 40, .08);
  --p-red: #d64532;
  --p-blue: #2f78c4;
  --p-orange: #e8932c;
  --p-white: #ffffff;
  --p-green: #2f9e57;
  --p-purple: #8a4fc7;
  --p-none: #a3adb1;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c171c;
    --surface: #14252c;
    --surface-2: #1a2f37;
    --ink: #e7f0f2;
    --muted: #93a9b1;
    --line: #27404a;
    --accent: #58c4d6;
    --accent-ink: #06222a;
    --accent-soft: #17414b;
    --sea: #10303a;
    --sea-edge: #1f4a58;
    --pier: #a89272;
    --good: #5fc58a;
    --warn: #e0a23a;
    --bad: #ee7a68;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c171c;
  --surface: #14252c;
  --surface-2: #1a2f37;
  --ink: #e7f0f2;
  --muted: #93a9b1;
  --line: #27404a;
  --accent: #58c4d6;
  --accent-ink: #06222a;
  --accent-soft: #17414b;
  --sea: #10303a;
  --sea-edge: #1f4a58;
  --pier: #a89272;
  --good: #5fc58a;
  --warn: #e0a23a;
  --bad: #ee7a68;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  -webkit-tap-highlight-color: transparent;
}
/* Sans ceci, les « display » des classes (.welcome, .nav…) l'emportent sur l'attribut hidden. */
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- En-tête ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.top-actions { display: flex; gap: 8px; }

/* ---------- Boutons ---------- */
.btn {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .08s ease, background .15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.big { min-height: 56px; font-size: 18px; width: 100%; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.danger { color: var(--bad); }

/* ---------- Disposition ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; align-items: start; }
.stage { position: sticky; top: 8px; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; order: 3; }
  .side { display: contents; }
  .hand { order: 1; }
  .scores { order: 2; }
  .log { order: 4; }
}

/* ---------- Plateau ---------- */
.stage-card { position: relative; overflow: hidden; background: var(--sea); border-radius: 18px; border: 1px solid var(--sea-edge); }
#board { display: block; width: 100%; height: auto; max-height: calc(100vh - 90px); }
@media (max-width: 920px) { #board { max-height: none; } }
.banner {
  position: absolute; left: 12px; right: 12px; top: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  pointer-events: none;
}
.banner > * { pointer-events: auto; }
.say {
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  padding: 7px 14px 7px 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: 650; max-width: 100%;
}
.dice { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; box-shadow: var(--shadow); }
.dice .sum { font: 800 20px var(--f-display); min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; animation: sum-in .3s ease-out both; animation-delay: calc(var(--el, -9999ms) + 1200ms); }
@keyframes sum-in { from { opacity: 0; transform: scale(.4); } }

/* Dé en 3D : six faces sur un cube ; data-v oriente le cube pour montrer la face tirée.
   Le lancer (.rolling) le jette, le fait tourner et rebondir, puis le pose sur cette face. */
.cube-box { --sz: 34px; position: relative; display: inline-block; width: var(--sz); height: var(--sz); perspective: calc(var(--sz) * 8); flex: none; }
.cube { position: absolute; inset: 0; transform-style: preserve-3d; transform: translate(0, 0) rotateX(var(--rx)) rotateY(var(--ry)); --rx: 0deg; --ry: 0deg; }
.cube[data-v="2"] { --rx: -90deg; }
.cube[data-v="3"] { --ry: -90deg; }
.cube[data-v="4"] { --ry: 90deg; }
.cube[data-v="5"] { --rx: 90deg; }
.cube[data-v="6"] { --ry: 180deg; }
.face {
  position: absolute; inset: 0; border-radius: 20%; background: #fffdf8; border: 1px solid #c9bfae;
  box-shadow: inset 0 0 0 calc(var(--sz) * .04) #fff, inset 0 calc(var(--sz) * -.08) calc(var(--sz) * .14) rgba(90, 70, 40, .22);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 15%; backface-visibility: hidden;
}
.face i { width: 72%; height: 72%; place-self: center; border-radius: 50%; background: #1b1b1b; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .25); }
.f1 i { background: #c2281a; width: 90%; height: 90%; }
.face .tl { grid-area: 1 / 1; } .face .tr { grid-area: 1 / 3; } .face .ml { grid-area: 2 / 1; } .face .mr { grid-area: 2 / 3; }
.face .c { grid-area: 2 / 2; } .face .bl { grid-area: 3 / 1; } .face .br { grid-area: 3 / 3; }
.f1 { transform: translateZ(calc(var(--sz) / 2)); }
.f6 { transform: rotateY(180deg) translateZ(calc(var(--sz) / 2)); }
.f3 { transform: rotateY(90deg) translateZ(calc(var(--sz) / 2)); }
.f4 { transform: rotateY(-90deg) translateZ(calc(var(--sz) / 2)); }
.f2 { transform: rotateX(90deg) translateZ(calc(var(--sz) / 2)); }
.f5 { transform: rotateX(-90deg) translateZ(calc(var(--sz) / 2)); }
.cube-shadow { position: absolute; left: 8%; right: 8%; bottom: -14%; height: 22%; border-radius: 50%; background: rgba(0, 0, 0, .28); filter: blur(2px); }
.cube-box.rolling .cube { animation: cube-roll 1.3s cubic-bezier(.3, .6, .4, 1) both; animation-delay: var(--el); }
.cube-box.rolling.alt .cube { animation-name: cube-roll-alt; }
.cube-box.rolling .cube-shadow { animation: cube-shadow 1.3s cubic-bezier(.3, .6, .4, 1) both; animation-delay: var(--el); }
@keyframes cube-roll {
  0% { transform: translate(-160%, -260%) rotateX(calc(var(--rx) + 1080deg)) rotateY(calc(var(--ry) + 720deg)); }
  38% { transform: translate(-50%, 0) rotateX(calc(var(--rx) + 470deg)) rotateY(calc(var(--ry) + 300deg)); }
  56% { transform: translate(-18%, -70%) rotateX(calc(var(--rx) + 200deg)) rotateY(calc(var(--ry) + 120deg)); }
  72% { transform: translate(-4%, 0) rotateX(calc(var(--rx) + 40deg)) rotateY(calc(var(--ry) + 25deg)); }
  84% { transform: translate(0, -16%) rotateX(calc(var(--rx) + 8deg)) rotateY(calc(var(--ry) + 4deg)); }
  100% { transform: translate(0, 0) rotateX(var(--rx)) rotateY(var(--ry)); }
}
@keyframes cube-roll-alt {
  0% { transform: translate(170%, -240%) rotateX(calc(var(--rx) - 900deg)) rotateY(calc(var(--ry) + 1080deg)); }
  40% { transform: translate(55%, 0) rotateX(calc(var(--rx) - 380deg)) rotateY(calc(var(--ry) + 430deg)); }
  58% { transform: translate(20%, -60%) rotateX(calc(var(--rx) - 150deg)) rotateY(calc(var(--ry) + 170deg)); }
  74% { transform: translate(5%, 0) rotateX(calc(var(--rx) - 30deg)) rotateY(calc(var(--ry) + 30deg)); }
  86% { transform: translate(0, -12%) rotateX(calc(var(--rx) - 6deg)) rotateY(calc(var(--ry) + 5deg)); }
  100% { transform: translate(0, 0) rotateX(var(--rx)) rotateY(var(--ry)); }
}
@keyframes cube-shadow { 0% { opacity: 0; transform: scale(.4); } 38%, 72%, 100% { opacity: 1; transform: none; } 56% { opacity: .5; transform: scale(.7); } }

.tgt { fill: var(--accent); fill-opacity: .55; stroke: #fff; stroke-width: 6; pointer-events: none; animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.tgt-e { stroke: #fff; stroke-opacity: .9; stroke-width: 26; stroke-linecap: round; pointer-events: none; animation: glow 1.4s ease-in-out infinite; }
.tgt-h { fill: #000; fill-opacity: 0; cursor: pointer; }
.tgt-h:hover { fill-opacity: .22; }
.tgt-h-ring { fill: none; stroke: #fff; stroke-width: 6; stroke-dasharray: 14 10; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.25); fill-opacity: .6; } }
@keyframes glow { 50% { stroke-opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .tgt, .tgt-e, .cube-box .cube, .cube-box .cube-shadow, .dice .sum { animation: none !important; } }
.piece { stroke: #1b1b1b; stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .4)); }

/* ---------- Joueurs et scores ---------- */
.scores { padding: 12px; }
.scores h2, .log h2, .hand h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.players { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.pl {
  display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2);
  --pc: var(--p-none);
}
.pl.turn { border-color: color-mix(in srgb, var(--pc) 70%, #1b1b1b); background: var(--surface); box-shadow: inset 5px 0 0 var(--pc), inset 6px 0 0 rgba(27, 27, 27, .35); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); border: 2px solid #1b1b1b; flex: none; }
.pl b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .pts { font: 800 22px var(--f-display); font-variant-numeric: tabular-nums; }
.pl .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.bank { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.bank span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }

/* ---------- Main du joueur (vue téléphone) ---------- */
.hand { padding: 14px; display: flex; flex-direction: column; gap: 12px; --pc: var(--p-none); }
.hand-head { display: flex; align-items: center; gap: 10px; }
.hand-head h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 20px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hand-head .vp { font: 800 22px var(--f-display); }
.hand-head .vp small { font: 600 12px var(--f-body); color: var(--muted); margin-left: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-height: 34px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; position: relative;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .alert { position: absolute; top: -4px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
.hint { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-weight: 600; }
.hint.go { background: var(--accent); color: var(--accent-ink); }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tile {
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 2px 6px; text-align: center; background: var(--surface-2);
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
}
.tile .ico { width: 34px; height: 34px; }
.tile b { font: 800 24px var(--f-display); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; color: var(--muted); font-weight: 600; }
.tile.zero { opacity: .5; }
.ico { width: 28px; height: 28px; flex: none; }
.mini { width: 16px; height: 16px; flex: none; }
.section-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 2px 0 -4px; }
.devs { display: grid; gap: 6px; }
.dev { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.dev .nm { flex: 1; min-width: 0; font-weight: 650; }
.dev .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.dev .cnt { font: 800 16px var(--f-display); min-width: 22px; text-align: center; }
.builds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.build { text-align: left; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 12px; min-height: 56px; }
.build .cost { display: flex; gap: 1px; flex-wrap: wrap; min-height: 16px; }
.build[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; }
.sheet { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; }
.tabs .btn { flex: 1; min-height: 38px; }
.tabs .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick {
  min-height: 62px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 650; padding: 4px 0;
}
.pick small { color: var(--muted); font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; }
.pick[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: -1px; background: var(--accent-soft); }
.pick:disabled { opacity: .35; }
.stepper-grid { display: grid; gap: 6px; }
.stepper { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 8px; }
.stepper .nm { font-weight: 600; }
.stepper b { min-width: 24px; text-align: center; font: 800 18px var(--f-display); font-variant-numeric: tabular-nums; }
.stepper .btn { min-height: 36px; min-width: 40px; padding: 0; font-size: 20px; }
.offer { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 2px solid var(--warn); background: var(--surface); }
.offer .line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 650; }
.bundle { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-weight: 800; }
.resp { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.resp .st { font-size: 13px; color: var(--muted); }
.resp .st.yes { color: var(--good); font-weight: 700; }
.resp .st.no { color: var(--bad); font-weight: 700; }
.toast { position: sticky; bottom: 8px; padding: 10px 12px; border-radius: 10px; background: var(--bad); color: #fff; font-weight: 650; }

/* ---------- Choix des couleurs et tirage de départ ---------- */
.roll-stage { position: absolute; inset: 0; display: grid; place-items: center; padding: 70px 16px 16px; pointer-events: none; z-index: 4; }
.roll-stage:empty { display: none; }
.stage-in {
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 18px 22px 20px; text-align: center; max-width: 640px;
}
.stage-in h2 { font: 800 26px var(--f-display); letter-spacing: -.01em; }
.stage-in p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stage-in.compact { padding: 12px; }
.stage-in.compact h2 { font-size: 16px; }
.stage-in.compact p { font-size: 13px; }
.stage-colors { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; text-align: left; }
.stage-colors li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.stage-colors li span:last-child { color: var(--muted); font-weight: 650; }
.stage-dice { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 26px; }
.stage-dice li { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 84px; }
.stage-dice .cube-box { --sz: 64px; margin: 6px 0 10px; }
.stage-in.compact .stage-dice { gap: 12px 16px; }
.stage-in.compact .stage-dice li { min-width: 64px; }
.stage-in.compact .stage-dice .cube-box { --sz: 44px; }
.cube-empty {
  width: 64px; height: 64px; margin: 6px 0 10px; display: grid; place-items: center; border-radius: 13px; border: 3px dashed var(--line);
  color: var(--muted); font: 800 28px var(--f-display);
}
.stage-in.compact .cube-empty { width: 44px; height: 44px; font-size: 20px; border-radius: 9px; }
.stage-dice .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-dice .rank { font: 800 15px var(--f-display); padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); animation: sum-in .3s ease-out both; animation-delay: calc(var(--sl) + 1300ms); }
.stage-dice .rank.first { background: #ffd34d; color: #1b1b1b; }
.stage-dice small { color: var(--muted); font-size: 12px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// Moteur de règles de « Au temps béni des colonies ». Pur : pas de DOM, pas de Math.random, état = JSON.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const RES_FR = { wood: 'bois', brick: 'argile', sheep: 'laine', wheat: 'blé', ore: 'minerai' };
  const TERRAIN_RES = { forest: 'wood', hills: 'brick', pasture: 'sheep', fields: 'wheat', mountains: 'ore', desert: null };
  const COLORS = ['red', 'blue', 'orange', 'white', 'green', 'purple'];
  const COLOR_FR = { red: 'rouge', blue: 'bleu', orange: 'orange', white: 'blanc', green: 'vert', purple: 'violet' };
  const COST = {
    road: { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
    city: { wheat: 2, ore: 3 },
    dev: { sheep: 1, wheat: 1, ore: 1 },
  };
  const LIMITS = { road: 15, settlement: 5, city: 4 };
  const DEV_FR = { knight: 'Chevalier', vp: 'Point de victoire', roadBuilding: 'Construction de routes', yearOfPlenty: 'Invention', monopoly: 'Monopole' };
  const WIN_POINTS = 10;

  class RuleError extends Error {}
  const need = (cond, msg) => { if (!cond) throw new RuleError(msg); };

  // ---------- Hasard à graine (mulberry32), stocké dans l'état ----------
  function rngNext(s) {
    s.rng = (s.rng + 0x6D2B79F5) | 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rint = (s, n) => Math.floor(rngNext(s) * n);
  function shuffle(s, a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = rint(s, i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Utilitaires ----------
  const zero = () => ({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 });
  const total = (h) => RES.reduce((n, r) => n + h[r], 0);
  const has = (h, c) => RES.every((r) => h[r] >= (c[r] || 0));
  const repeat = (x, n) => Array.from({ length: n }, () => x);
  function clone(s) {
    const board = s.board;
    s.board = null;
    const c = JSON.parse(JSON.stringify(s));
    s.board = board;
    c.board = board;
    return c;
  }
  // Une ligne de journal porte le joueur qui agit (p), pour que l'interface la colore.
  function log(s, text, p) {
    s.log.push(p == null ? { t: text } : { t: text, p });
    if (s.log.length > 300) s.log.splice(0, s.log.length - 300);
  }
  const nameOf = (s, p) => s.players[p].name;

  // ---------- Plateau ----------
  const HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

  const SPIRAL_TOKENS = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];

  function ringCoords(radius) {
    if (radius === 0) return [[0, 0]];
    const out = [];
    let q = HEX_DIRS[4][0] * radius, r = HEX_DIRS[4][1] * radius;
    for (let side = 0; side < 6; side++) {
      for (let j = 0; j < radius; j++) {
        out.push([q, r]);
        q += HEX_DIRS[side][0];
        r += HEX_DIRS[side][1];
      }
    }
    return out;
  }

  // Ordre de pose des jetons : couronne extérieure depuis un coin tiré au hasard,
  // dans un sens tiré au hasard, puis couronne intérieure, puis le centre.
  function spiralOrder(s) {
    const corner = rint(s, 6);
    const reversed = rint(s, 2) === 1;
    let outer = ringCoords(2);
    outer = outer.slice(corner * 2).concat(outer.slice(0, corner * 2));
    const [oq, or] = outer[0];
    let inner = ringCoords(1);
    const at = inner.findIndex(([q, r]) => q === oq / 2 && r === or / 2);
    inner = inner.slice(at).concat(inner.slice(0, at));
    if (reversed) {
      outer = [outer[0], ...outer.slice(1).reverse()];
      inner = [inner[0], ...inner.slice(1).reverse()];
    }
    return outer.concat(inner, [[0, 0]]);
  }

  function buildBoard(s) {
    const coords = [];
    for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) if (Math.abs(q + r) <= 2) coords.push([q, r]);

    const hexes = coords.map(([q, r], id) => ({
      id, q, r,
      x: Math.sqrt(3) * (q + r / 2),
      y: 1.5 * r,
      terrain: null,
      number: null,
      vertices: [],
    }));
    const hexAt = (q, r) => hexes.find((h) => h.q === q && h.r === r);
    const hexNbrs = (h) => HEX_DIRS.map(([dq, dr]) => hexAt(h.q + dq, h.r + dr)).filter(Boolean);
    const hot = (h) => h.number === 6 || h.number === 8;

    // Comme le vrai jeu : tuiles mélangées, puis jetons A à R posés en spirale
    // depuis un coin de la côte, vers l'intérieur, en sautant le désert.
    let spiral = [];
    for (let tries = 0; tries < 200; tries++) {
      const terrains = shuffle(s, [
        ...repeat('forest', 4), ...repeat('pasture', 4), ...repeat('fields', 4),
        ...repeat('hills', 3), ...repeat('mountains', 3), 'desert',
      ]);
      hexes.forEach((h, i) => { h.terrain = terrains[i]; h.number = null; });
      spiral = spiralOrder(s).map(([q, r]) => hexAt(q, r).id);
      let k = 0;
      spiral.forEach((id) => {
        if (hexes[id].terrain !== 'desert') hexes[id].number = SPIRAL_TOKENS[k++];
      });
      if (!hexes.some((h) => hot(h) && hexNbrs(h).some((n) => hot(n)))) break;
    }

    // Sommets et arêtes dédupliqués par position.
    const vertices = [];
    const vIndex = new Map();
    const edges = [];
    const eIndex = new Map();
    const vertexId = (x, y) => {
      const key = Math.round(x * 1000) + ',' + Math.round(y * 1000);
      if (!vIndex.has(key)) {
        vIndex.set(key, vertices.length);
        vertices.push({ id: vertices.length, x, y, hexes: [], nbrs: [], edges: [], port: null });
      }
      return vIndex.get(key);
    };
    hexes.forEach((h) => {
      for (let i = 0; i < 6; i++) {
        const a = ((60 * i - 30) * Math.PI) / 180;
        const id = vertexId(h.x + Math.cos(a), h.y + Math.sin(a));
        h.vertices.push(id);
        vertices[id].hexes.push(h.id);
      }
      for (let i = 0; i < 6; i++) {
        const a = h.vertices[i];
        const b = h.vertices[(i + 1) % 6];
        const key = Math.min(a, b) + '-' + Math.max(a, b);
        if (!eIndex.has(key)) {
          eIndex.set(key, edges.length);
          edges.push({ id: edges.length, a, b, hexes: [] });
        }
        edges[eIndex.get(key)].hexes.push(h.id);
      }
    });
    edges.forEach((e) => {
      vertices[e.a].edges.push(e.id);
      vertices[e.b].edges.push(e.id);
      vertices[e.a].nbrs.push(e.b);
      vertices[e.b].nbrs.push(e.a);
    });

    // Ports : 9 sur les 30 arêtes côtières, espacés 3-3-4.
    const coast = edges
      .filter((e) => e.hexes.length === 1)
      .map((e) => {
        const A = vertices[e.a], B = vertices[e.b];
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        return { e, mx, my, ang: Math.atan2(my, mx) };
      })
      .sort((p, q) => p.ang - q.ang);
    const types = shuffle(s, ['any', 'any', 'any', 'any', 'wood', 'brick', 'sheep', 'wheat', 'ore']);
    const gaps = [0, 3, 6, 10, 13, 16, 20, 23, 26];
    const ports = gaps.map((g, i) => {
      const c = coast[g % coast.length];
      const h = hexes[c.e.hexes[0]];
      const dx = c.mx - h.x, dy = c.my - h.y;
      const len = Math.hypot(dx, dy);
      vertices[c.e.a].port = types[i];
      vertices[c.e.b].port = types[i];
      return { edge: c.e.id, a: c.e.a, b: c.e.b, type: types[i], x: c.mx, y: c.my, nx: dx / len, ny: dy / len };
    });

    return { hexes, vertices, edges, ports, spiral };
  }

  // Le plateau ne dépend que de la graine : un téléphone le reconstruit sans le recevoir.
  function boardFromSeed(seed) {
    return buildBoard({ rng: seed | 0 });
  }

  // ---------- Création de partie ----------
  function newGame(opts) {
    const names = opts.names;
    need(names.length >= 2 && names.length <= 4, 'Entre 2 et 4 joueurs.');
    const seed = (opts.seed == null ? 1 : opts.seed) | 0;
    const s = { rng: seed, seed };
    s.board = buildBoard(s);
    s.players = names.map((name, id) => ({
      id, name, color: null,
      hand: zero(), dev: [], knights: 0,
    }));
    s.bank = { wood: 19, brick: 19, sheep: 19, wheat: 19, ore: 19 };
    s.devDeck = shuffle(s, [
      ...repeat('knight', 14), ...repeat('vp', 5), ...repeat('roadBuilding', 2),
      ...repeat('yearOfPlenty', 2), ...repeat('monopoly', 2),
    ]);
    s.buildings = {};
    s.roads = {};
    s.robber = s.board.hexes.find((h) => h.terrain === 'desert').id;
    const all = names.map((_, i) => i);
    s.order = { groups: [all], pending: all.slice(), rolls: names.map(() => []) };
    s.setup = { idx: 0, order: [], last: null };
    s.phase = 'color';
    s.step = 'pickColor';
    s.turn = 0;
    s.turnNo = 0;
    s.dice = null;
    s.discard = {};
    s.victims = [];
    s.returnStep = 'actions';
    s.freeRoads = 0;
    s.devPlayed = false;
    s.trade = null;
    s.longestRoad = { holder: null, len: 0 };
    s.largestArmy = { holder: null, size: 0 };
    s.winner = null;
    s.log = [];
    log(s, 'La partie commence. Chacun choisit sa couleur.');
    return s;
  }

  // ---------- Requêtes de règles ----------
  const buildingsOf = (s, pid, type) => Object.keys(s.buildings).filter((v) => s.buildings[v].owner === pid && (!type || s.buildings[v].type === type)).length;
  const roadsOf = (s, pid) => Object.keys(s.roads).filter((e) => s.roads[e] === pid).length;

  function legalSettlements(s, pid, free) {
    return s.board.vertices.filter((v) => {
      if (s.buildings[v.id]) return false;
      if (v.nbrs.some((n) => s.buildings[n])) return false;
      return free || v.edges.some((e) => s.roads[e] === pid);
    }).map((v) => v.id);
  }
  function legalCities(s, pid) {
    return Object.keys(s.buildings).filter((v) => s.buildings[v].owner === pid && s.buildings[v].type === 'settlement').map(Number);
  }
  function legalRoads(s, pid, fromVertex) {
    return s.board.edges.filter((e) => {
      if (s.roads[e.id] !== undefined) return false;
      if (fromVertex != null) return e.a === fromVertex || e.b === fromVertex;
      return [e.a, e.b].some((v) => {
        const b = s.buildings[v];
        if (b) return b.owner === pid;
        return s.board.vertices[v].edges.some((x) => x !== e.id && s.roads[x] === pid);
      });
    }).map((e) => e.id);
  }
  function legalRobberHexes(s) {
    return s.board.hexes.filter((h) => h.id !== s.robber).map((h) => h.id);
  }

  function tradeRatios(s, pid) {
    const r = { wood: 4, brick: 4, sheep: 4, wheat: 4, ore: 4 };
    s.board.vertices.forEach((v) => {
      const b = s.buildings[v.id];
      if (!b || b.owner !== pid || !v.port) return;
      if (v.port === 'any') RES.forEach((k) => { r[k] = Math.min(r[k], 3); });
      else r[v.port] = Math.min(r[v.port], 2);
    });
    return r;
  }

  const devPlayable = (s, p, kind) => p.dev.some((c) => c.k === kind && c.t < s.turnNo);

  // Plus longue route d'un joueur : parcours en profondeur, les colonies adverses coupent la chaîne.
  function longestRoadOf(s, pid) {
    const verts = s.board.vertices;
    const mine = (e) => s.roads[e] === pid;
    const blocked = (v) => s.buildings[v] && s.buildings[v].owner !== pid;
    const used = new Set();
    const other = (e, v) => (s.board.edges[e].a === v ? s.board.edges[e].b : s.board.edges[e].a);
    function dfs(v) {
      let best = 0;
      for (const e of verts[v].edges) {
        if (!mine(e) || used.has(e)) continue;
        used.add(e);
        const w = other(e, v);
        best = Math.max(best, 1 + (blocked(w) ? 0 : dfs(w)));
        used.delete(e);
      }
      return best;
    }
    let best = 0;
    verts.forEach((v) => { if (v.edges.some(mine)) best = Math.max(best, dfs(v.id)); });
    return best;
  }

  function points(s, pid, withHidden) {
    let n = buildingsOf(s, pid, 'settlement') + 2 * buildingsOf(s, pid, 'city');
    if (s.longestRoad.holder === pid) n += 2;
    if (s.largestArmy.holder === pid) n += 2;
    if (withHidden) n += (s.players[pid].dev || []).filter((c) => c.k === 'vp').length;
    return n;
  }

  // ---------- Effets ----------
  function pay(s, p, cost) {
    RES.forEach((r) => { p.hand[r] -= cost[r] || 0; s.bank[r] += cost[r] || 0; });
  }
  function grant(s, p, r, n) {
    p.hand[r] += n;
    s.bank[r] -= n;
  }

  function produce(s, n) {
    const want = {};
    s.board.hexes.forEach((h) => {
      if (h.number !== n || h.id === s.robber) return;
      const res = TERRAIN_RES[h.terrain];
      h.vertices.forEach((v) => {
        const b = s.buildings[v];
        if (!b) return;
        want[res] = want[res] || {};
        want[res][b.owner] = (want[res][b.owner] || 0) + (b.type === 'city' ? 2 : 1);
      });
    });
    const gains = [];
    Object.keys(want).forEach((res) => {
      const owners = Object.keys(want[res]).map(Number);
      const sum = owners.reduce((a, o) => a + want[res][o], 0);
      if (sum <= s.bank[res]) {
        owners.forEach((o) => { grant(s, s.players[o], res, want[res][o]); gains.push([o, res, want[res][o]]); });
      } else if (owners.length === 1) {
        const n2 = s.bank[res];
        if (n2 > 0) { grant(s, s.players[owners[0]], res, n2); gains.push([owners[0], res, n2]); }
      } else {
        log(s, 'La banque n\'a pas assez de ' + RES_FR[res] + ' : personne n\'en reçoit.');
      }
    });
    const byPlayer = {};
    gains.forEach(([o, res, k]) => { (byPlayer[o] = byPlayer[o] || []).push(k + ' ' + RES_FR[res]); });
    const owners = Object.keys(byPlayer).map(Number);
    owners.forEach((o) => log(s, nameOf(s, o) + ' reçoit ' + byPlayer[o].join(', ') + '.', o));
    if (!owners.length) log(s, 'Personne ne produit.');
  }

  function startRobber(s, returnStep) {
    s.returnStep = returnStep;
    s.step = 'robber';
  }

  function stealFrom(s, thief, victim) {
    const v = s.players[victim];
    const pool = [];
    RES.forEach((r) => pool.push(...repeat(r, v.hand[r])));
    if (!pool.length) return;
    const r = pool[rint(s, pool.length)];
    v.hand[r]--;
    s.players[thief].hand[r]++;
    log(s, nameOf(s, thief) + ' vole une carte à ' + nameOf(s, victim) + '.', thief);
  }

  function checkRoadAndArmy(s) {
    const lens = s.players.map((p) => longestRoadOf(s, p.id));
    const max = Math.max(...lens);
    const prev = s.longestRoad.holder;
    let holder = null;
    if (max >= 5) {
      const top = lens.map((l, i) => (l === max ? i : -1)).filter((i) => i >= 0);
      if (prev !== null && top.includes(prev)) holder = prev;
      else if (top.length === 1) holder = top[0];
    }
    if (holder !== prev && holder !== null) log(s, nameOf(s, holder) + ' obtient la plus longue route (' + max + ').', holder);
    if (holder !== prev && holder === null) log(s, 'Plus personne n\'a la plus longue route.');
    s.longestRoad = { holder, len: holder === null ? 0 : max };
    s.players.forEach((p, i) => { p.roadLen = lens[i]; });

    let ah = s.largestArmy.holder;
    let best = s.largestArmy.size;
    s.players.forEach((p) => {
      if (p.knights >= 3 && p.knights > best) {
        ah = p.id;
        best = p.knights;
      }
    });
    if (ah !== s.largestArmy.holder) log(s, nameOf(s, ah) + ' obtient la plus grande armée (' + best + ').', ah);
    s.largestArmy = { holder: ah, size: best };
  }

  function afterAction(s) {
    checkRoadAndArmy(s);
    if (s.phase === 'main' && points(s, s.turn, true) >= WIN_POINTS) {
      s.phase = 'ended';
      s.step = 'ended';
      s.winner = s.turn;
      s.trade = null;
      log(s, nameOf(s, s.turn) + ' remporte la partie avec ' + points(s, s.turn, true) + ' points !', s.turn);
    }
  }

  // ---------- Actions ----------
  const handlers = {};

  function turnOnly(s, a) {
    need(s.phase !== 'ended', 'La partie est terminée.');
    need(s.phase !== 'color', 'Choisis d\'abord ta couleur.');
    need(s.phase !== 'order', 'Lance d\'abord le dé pour savoir qui commence.');
    need(a.player === s.turn, 'Ce n\'est pas ton tour.');
  }
  function mainActions(s, a) {
    turnOnly(s, a);
    need(s.phase === 'main' && s.step === 'actions', 'Tu ne peux pas faire ça maintenant.');
  }
  function clearTrade(s) { s.trade = null; }

  // Choix des couleurs : chacun la sienne, premier arrivé premier servi.
  handlers.pickColor = (s, a) => {
    need(s.phase === 'color', 'Les couleurs sont déjà choisies.');
    need(!s.players[a.player].color, 'Tu as déjà choisi ta couleur.');
    need(COLORS.includes(a.color), 'Couleur inconnue.');
    need(!s.players.some((p) => p.color === a.color), 'Cette couleur est déjà prise.');
    s.players[a.player].color = a.color;
    log(s, nameOf(s, a.player) + ' joue en ' + COLOR_FR[a.color] + '.', a.player);
    if (s.players.every((p) => p.color)) {
      s.phase = 'order';
      s.step = 'rollOrder';
      log(s, 'Chacun lance un dé : du plus grand au plus petit, chacun choisit où poser sa colonie.');
    }
  };

  // Tirage de l'ordre : un dé chacun ; les ex aequo relancent entre eux jusqu'à être départagés.
  handlers.rollOrder = (s, a) => {
    need(s.phase !== 'color', 'Choisis d\'abord ta couleur.');
    need(s.phase === 'order', 'L\'ordre de jeu est déjà décidé.');
    need(s.order.pending.includes(a.player), 'Tu as déjà lancé ton dé.');
    const d = rint(s, 6) + 1;
    s.order.rolls[a.player].push(d);
    s.order.pending = s.order.pending.filter((p) => p !== a.player);
    log(s, nameOf(s, a.player) + ' lance le dé : ' + d + '.', a.player);
    if (!s.order.pending.length) settleOrder(s);
  };

  // order.groups : joueurs rangés du plus grand dé au plus petit ; un groupe de plusieurs = égalité à départager.
  function settleOrder(s) {
    const o = s.order;
    const last = (p) => o.rolls[p][o.rolls[p].length - 1];
    o.groups = o.groups.flatMap((g) => {
      if (g.length === 1) return [g];
      const values = [...new Set(g.map(last))].sort((x, y) => y - x);
      return values.map((d) => g.filter((p) => last(p) === d));
    });
    const ties = o.groups.filter((g) => g.length > 1);
    if (ties.length) {
      o.pending = ties.flat();
      ties.forEach((g) => log(s, 'Égalité à ' + last(g[0]) + ' : ' + g.map((p) => nameOf(s, p)).join(' et ') + ' relancent.'));
      return;
    }
    const ranked = o.groups.flat();
    s.setup.order = ranked.concat(ranked.slice().reverse());
    s.phase = 'setup';
    s.step = 'settlement';
    s.turn = ranked[0];
    log(s, 'Ordre de pose : ' + ranked.map((p) => nameOf(s, p) + ' (' + o.rolls[p].join(' puis ') + ')').join(', ') + '.');
    log(s, nameOf(s, ranked[0]) + ' choisit sa place en premier.', ranked[0]);
  }

  handlers.placeSettlement = (s, a) => {
    turnOnly(s, a);
    const p = s.players[a.player];
    if (s.phase === 'setup') {
      need(s.step === 'settlement', 'Pose d\'abord ta route.');
      need(legalSettlements(s, a.player, true).includes(a.vertex), 'Emplacement interdit.');
      s.buildings[a.vertex] = { owner: a.player, type: 'settlement' };
      s.setup.last = a.vertex;
      if (s.setup.idx >= s.players.length) {
        const got = [];
        s.board.vertices[a.vertex].hexes.forEach((hid) => {
          const res = TERRAIN_RES[s.board.hexes[hid].terrain];
          if (res && s.bank[res] > 0) { grant(s, p, res, 1); got.push(RES_FR[res]); }
        });
        if (got.length) log(s, p.name + ' reçoit ' + got.join(', ') + '.', p.id);
      }
      s.step = 'road';
      log(s, p.name + ' pose une colonie.', p.id);
      return;
    }
    mainActions(s, a);
    need(buildingsOf(s, a.player, 'settlement') < LIMITS.settlement, 'Plus de colonies disponibles.');
    need(has(p.hand, COST.settlement), 'Pas assez de ressources.');
    need(legalSettlements(s, a.player, false).includes(a.vertex), 'Emplacement interdit.');
    pay(s, p, COST.settlement);
    s.buildings[a.vertex] = { owner: a.player, type: 'settlement' };
    clearTrade(s);
    log(s, p.name + ' construit une colonie.', p.id);
  };

  handlers.placeCity = (s, a) => {
    mainActions(s, a);
    const p = s.players[a.player];
    need(buildingsOf(s, a.player, 'city') < LIMITS.city, 'Plus de villes disponibles.');
    need(has(p.hand, COST.city), 'Pas assez de ressources.');
    need(legalCities(s, a.player).includes(a.vertex), 'Il faut une de tes colonies.');
    pay(s, p, COST.city);
    s.buildings[a.vertex].type = 'city';
    clearTrade(s);
    log(s, p.name + ' transforme une colonie en ville.', p.id);
  };

  handlers.placeRoad = (s, a) => {
    turnOnly(s, a);
    const p = s.players[a.player];
    if (s.phase === 'setup') {
      need(s.step === 'road', 'Pose d\'abord ta colonie.');
      need(legalRoads(s, a.player, s.setup.last).includes(a.edge), 'La route doit toucher ta nouvelle colonie.');
      s.roads[a.edge] = a.player;
      log(s, p.name + ' pose une route.', p.id);
      s.setup.idx++;
      if (s.setup.idx >= s.setup.order.length) {
        s.phase = 'main';
        s.step = 'roll';
        s.turn = s.setup.order[s.setup.order.length - 1];
        s.turnNo = 1;
        log(s, 'Mise en place terminée. ' + nameOf(s, s.turn) + ' commence.', s.turn);
      } else {
        s.turn = s.setup.order[s.setup.idx];
        s.step = 'settlement';
      }
      return;
    }
    need(s.phase === 'main', 'Tu ne peux pas faire ça maintenant.');
    need(roadsOf(s, a.player) < LIMITS.road, 'Plus de routes disponibles.');
    need(legalRoads(s, a.player).includes(a.edge), 'Emplacement interdit.');
    if (s.step === 'roadBuilding') {
      s.roads[a.edge] = a.player;
      s.freeRoads--;
      log(s, p.name + ' pose une route gratuite.', p.id);
      if (s.freeRoads <= 0 || roadsOf(s, a.player) >= LIMITS.road || !legalRoads(s, a.player).length) {
        s.freeRoads = 0;
        s.step = s.returnStep;
      }
      return;
    }
    need(s.step === 'actions', 'Tu ne peux pas faire ça maintenant.');
    need(has(p.hand, COST.road), 'Pas assez de ressources.');
    pay(s, p, COST.road);
    s.roads[a.edge] = a.player;
    clearTrade(s);
    log(s, p.name + ' construit une route.', p.id);
  };

  handlers.roll = (s, a) => {
    turnOnly(s, a);
    need(s.phase === 'main' && s.step === 'roll', 'Les dés sont déjà lancés.');
    const d1 = rint(s, 6) + 1, d2 = rint(s, 6) + 1;
    s.dice = [d1, d2];
    const sum = d1 + d2;
    log(s, nameOf(s, a.player) + ' lance les dés : ' + d1 + ' + ' + d2 + ' = ' + sum + '.', a.player);
    if (sum !== 7) {
      produce(s, sum);
      s.step = 'actions';
      return;
    }
    s.discard = {};
    s.players.forEach((p) => {
      const n = total(p.hand);
      if (n > 7) s.discard[p.id] = Math.floor(n / 2);
    });
    if (Object.keys(s.discard).length) {
      s.returnStep = 'actions';
      s.step = 'discard';
      log(s, 'Un 7 ! Les joueurs avec plus de 7 cartes en défaussent la moitié.');
    } else {
      log(s, 'Un 7 ! Le voleur se déplace.');
      startRobber(s, 'actions');
    }
  };

  handlers.discard = (s, a) => {
    need(s.phase === 'main' && s.step === 'discard', 'Pas de défausse en cours.');
    const owed = s.discard[a.player];
    need(owed, 'Tu n\'as rien à défausser.');
    const cards = a.cards || {};
    const n = RES.reduce((k, r) => k + (cards[r] || 0), 0);
    need(n === owed, 'Il faut défausser exactement ' + owed + ' cartes.');
    need(RES.every((r) => (cards[r] || 0) >= 0 && Number.isInteger(cards[r] || 0)), 'Quantité invalide.');
    const p = s.players[a.player];
    need(has(p.hand, cards), 'Tu n\'as pas ces cartes.');
    pay(s, p, cards);
    delete s.discard[a.player];
    log(s, p.name + ' défausse ' + n + ' cartes.', p.id);
    if (!Object.keys(s.discard).length) startRobber(s, 'actions');
  };

  handlers.moveRobber = (s, a) => {
    turnOnly(s, a);
    need(s.step === 'robber', 'Le voleur ne bouge pas maintenant.');
    need(legalRobberHexes(s).includes(a.hex), 'Choisis un autre hexagone.');
    s.robber = a.hex;
    const h = s.board.hexes[a.hex];
    const victims = [];
    h.vertices.forEach((v) => {
      const b = s.buildings[v];
      if (b && b.owner !== a.player && total(s.players[b.owner].hand) > 0 && !victims.includes(b.owner)) victims.push(b.owner);
    });
    log(s, nameOf(s, a.player) + ' déplace le voleur.', a.player);
    if (victims.length === 0) s.step = s.returnStep;
    else if (victims.length === 1) { stealFrom(s, a.player, victims[0]); s.step = s.returnStep; }
    else { s.victims = victims; s.step = 'steal'; }
  };

  handlers.steal = (s, a) => {
    turnOnly(s, a);
    need(s.step === 'steal', 'Pas de vol en cours.');
    need(s.victims.includes(a.victim), 'Joueur non éligible.');
    stealFrom(s, a.player, a.victim);
    s.victims = [];
    s.step = s.returnStep;
  };

  handlers.buyDev = (s, a) => {
    mainActions(s, a);
    const p = s.players[a.player];
    need(s.devDeck.length > 0, 'Plus de cartes de développement.');
    need(has(p.hand, COST.dev), 'Pas assez de ressources.');
    pay(s, p, COST.dev);
    const k = s.devDeck.pop();
    p.dev.push({ k, t: s.turnNo });
    clearTrade(s);
    log(s, p.name + ' achète une carte de développement.', p.id);
  };

  function useDev(s, a, kind) {
    turnOnly(s, a);
    need(s.phase === 'main' && (s.step === 'roll' || s.step === 'actions'), 'Tu ne peux pas jouer de carte maintenant.');
    need(!s.devPlayed, 'Une seule carte de développement par tour.');
    const p = s.players[a.player];
    need(devPlayable(s, p, kind), 'Tu n\'as pas cette carte, ou elle vient d\'être achetée.');
    const i = p.dev.findIndex((c) => c.k === kind && c.t < s.turnNo);
    p.dev.splice(i, 1);
    s.devPlayed = true;
    clearTrade(s);
    return p;
  }

  handlers.playKnight = (s, a) => {
    const prev = s.step;
    const p = useDev(s, a, 'knight');
    p.knights++;
    log(s, p.name + ' joue un chevalier.', p.id);
    startRobber(s, prev);
  };

  handlers.playRoadBuilding = (s, a) => {
    need(roadsOf(s, a.player) < LIMITS.road && legalRoads(s, a.player).length > 0, 'Aucune route possible.');
    const prev = s.step;
    const p = useDev(s, a, 'roadBuilding');
    s.freeRoads = Math.min(2, LIMITS.road - roadsOf(s, a.player));
    s.returnStep = prev;
    s.step = 'roadBuilding';
    log(s, p.name + ' joue Construction de routes.', p.id);
  };

  handlers.playYearOfPlenty = (s, a) => {
    need(RES.includes(a.a) && RES.includes(a.b), 'Choisis deux ressources.');
    const want = zero();
    want[a.a]++;
    want[a.b]++;
    need(has(s.bank, want), 'La banque n\'a pas assez de cartes.');
    const p = useDev(s, a, 'yearOfPlenty');
    grant(s, p, a.a, 1);
    grant(s, p, a.b, 1);
    log(s, p.name + ' joue Invention et prend ' + RES_FR[a.a] + ' et ' + RES_FR[a.b] + '.', p.id);
  };

  handlers.playMonopoly = (s, a) => {
    need(RES.includes(a.res), 'Choisis une ressource.');
    const p = useDev(s, a, 'monopoly');
    let n = 0;
    s.players.forEach((o) => {
      if (o.id === p.id) return;
      n += o.hand[a.res];
      p.hand[a.res] += o.hand[a.res];
      o.hand[a.res] = 0;
    });
    log(s, p.name + ' joue Monopole sur ' + RES_FR[a.res] + ' et récupère ' + n + ' carte(s).', p.id);
  };

  handlers.bankTrade = (s, a) => {
    mainActions(s, a);
    need(RES.includes(a.give) && RES.includes(a.get) && a.give !== a.get, 'Échange invalide.');
    const p = s.players[a.player];
    const ratio = tradeRatios(s, a.player)[a.give];
    need(p.hand[a.give] >= ratio, 'Il te faut ' + ratio + ' ' + RES_FR[a.give] + '.');
    need(s.bank[a.get] > 0, 'La banque n\'a plus de ' + RES_FR[a.get] + '.');
    p.hand[a.give] -= ratio;
    s.bank[a.give] += ratio;
    grant(s, p, a.get, 1);
    clearTrade(s);
    log(s, p.name + ' échange ' + ratio + ' ' + RES_FR[a.give] + ' contre 1 ' + RES_FR[a.get] + ' à la banque.', p.id);
  };

  function cleanBundle(b) {
    const out = zero();
    RES.forEach((r) => {
      const n = (b && b[r]) || 0;
      need(Number.isInteger(n) && n >= 0, 'Quantité invalide.');
      out[r] = n;
    });
    return out;
  }

  handlers.offerTrade = (s, a) => {
    mainActions(s, a);
    const give = cleanBundle(a.give), want = cleanBundle(a.want);
    need(total(give) > 0 && total(want) > 0, 'Propose au moins une carte de chaque côté.');
    need(!RES.some((r) => give[r] > 0 && want[r] > 0), 'Ne demande pas la ressource que tu donnes.');
    need(has(s.players[a.player].hand, give), 'Tu n\'as pas ces cartes.');
    s.trade = { from: a.player, give, want, responses: {} };
    log(s, nameOf(s, a.player) + ' propose un échange.', a.player);
  };

  handlers.respondTrade = (s, a) => {
    need(s.trade, 'Aucune offre en cours.');
    need(a.player !== s.trade.from, 'C\'est ton offre.');
    if (a.accept) need(has(s.players[a.player].hand, s.trade.want), 'Tu n\'as pas les cartes demandées.');
    s.trade.responses[a.player] = !!a.accept;
  };

  handlers.confirmTrade = (s, a) => {
    mainActions(s, a);
    const t = s.trade;
    need(t && t.from === a.player, 'Aucune offre en cours.');
    need(t.responses[a.with] === true, 'Ce joueur n\'a pas accepté.');

    need(has(me.hand, t.give) && has(they.hand, t.want), 'Les mains ont changé, échange impossible.');
    RES.forEach((r) => {
      me.hand[r] += t.want[r] - t.give[r];
      they.hand[r] += t.give[r] - t.want[r];
    });

    log(s, me.name + ' et ' + they.name + ' concluent un échange.', me.id);

    mainActions(s, a);
    s.trade = null;
    s.turn = (s.turn + 1) % s.players.length;
    s.turnNo++;
    s.step = 'roll';
    s.dice = null;
    s.devPlayed = false;
    log(s, 'Au tour de ' + nameOf(s, s.turn) + '.', s.turn);
  };

  function apply(state, action) {
    const s = clone(state);
    try {
      const h = handlers[action && action.type];
      need(h, 'Action inconnue.');
      need(Number.isInteger(action.player) && action.player >= 0 && action.player < s.players.length, 'Joueur inconnu.');
      h(s, action);
      afterAction(s);
      return { ok: true, state: s };
    } catch (e) {
      if (e instanceof RuleError) return { ok: false, error: e.message, state };
      throw e;
    }

  // ---------- Ce que l'interface a le droit de proposer ----------
  function available(s, pid) {
    const p = s.players[pid];
    const mine = (s.phase === 'setup' || s.phase === 'main') && s.turn === pid;
    const main = s.phase === 'main';
    const acts = mine && main && s.step === 'actions';
    const canDevNow = mine && main && (s.step === 'roll' || s.step === 'actions') && !s.devPlayed;
    const afford = (c) => has(p.hand, c);
    const out = {
      myTurn: mine,
      pickColor: s.phase === 'color' && !p.color ? COLORS.filter((c) => !s.players.some((q) => q.color === c)) : null,
      rollOrder: s.phase === 'order' && s.order.pending.includes(pid),
      roll: mine && main && s.step === 'roll',
      endTurn: acts,
      discard: s.phase === 'main' && s.step === 'discard' ? s.discard[pid] || 0 : 0,
      moveRobber: mine && s.step === 'robber',
      steal: mine && s.step === 'steal' ? s.victims.slice() : null,
      setupSettlement: mine && s.phase === 'setup' && s.step === 'settlement',
      setupRoad: mine && s.phase === 'setup' && s.step === 'road',
      freeRoad: mine && s.step === 'roadBuilding',
      road: acts && afford(COST.road) && roadsOf(s, pid) < LIMITS.road && legalRoads(s, pid).length > 0,
      settlement: acts && afford(COST.settlement) && buildingsOf(s, pid, 'settlement') < LIMITS.settlement && legalSettlements(s, pid, false).length > 0,
      city: acts && afford(COST.city) && buildingsOf(s, pid, 'city') < LIMITS.city && legalCities(s, pid).length > 0,
      buyDev: acts && afford(COST.dev) && (s.devDeck ? s.devDeck.length : s.devDeckCount) > 0,
      trade: acts,
      ratios: tradeRatios(s, pid),
      dev: {
        knight: canDevNow && devPlayable(s, p, 'knight'),
        roadBuilding: canDevNow && devPlayable(s, p, 'roadBuilding') && legalRoads(s, pid).length > 0 && roadsOf(s, pid) < LIMITS.road,
        yearOfPlenty: canDevNow && devPlayable(s, p, 'yearOfPlenty') && total(s.bank) >= 2,
        monopoly: canDevNow && devPlayable(s, p, 'monopoly'),
      },
      respondTrade: !!(s.trade && s.trade.from !== pid && s.phase === 'main'),
    };
    // Surlignage de plateau selon l'étape.
    out.targets = { vertices: [], edges: [], hexes: [] };
    if (out.setupSettlement) out.targets.vertices = legalSettlements(s, pid, true);
    if (out.setupRoad) out.targets.edges = legalRoads(s, pid, s.setup.last);
    if (out.moveRobber) out.targets.hexes = legalRobberHexes(s);
    if (out.freeRoad) out.targets.edges = legalRoads(s, pid);
    return out;
  }

  // Emplacements pour un mode de construction demandé depuis la main.
  function targetsFor(s, pid, kind) {
    if (kind === 'road') return { edges: legalRoads(s, pid) };
    if (kind === 'settlement') return { vertices: legalSettlements(s, pid, false) };
    if (kind === 'city') return { vertices: legalCities(s, pid) };
    return {};
  }

  // Qui doit agir maintenant (utile à l'interface et au réseau).
  function actors(s) {
    if (s.phase === 'ended') return [];
    if (s.phase === 'color') return s.players.filter((p) => !p.color).map((p) => p.id);
    if (s.phase === 'order') return s.order.pending.slice();
    if (s.phase === 'main' && s.step === 'discard') return Object.keys(s.discard).map(Number);
    return [s.turn];
  }

  // Vue sûre à envoyer à un client : ses cartes en clair, celles des autres en nombre seulement.
  // opts.board:false retire le plateau (le client le reconstruit depuis la graine), opts.log limite le journal.
  function viewFor(s, pid, opts) {
    const o = opts || {};
    const v = clone(s);
    v.seed = s.seed;
    delete v.rng;
    v.devDeckCount = v.devDeck.length;
    delete v.devDeck;
    if (o.board === false) delete v.board;
    if (o.log) v.log = v.log.slice(-o.log);
    v.players.forEach((p) => {
      p.handCount = total(p.hand);
      p.devCount = p.dev.length;
      p.vp = points(s, p.id, p.id === pid);
      if (p.id !== pid) {
        delete p.hand;
        delete p.dev;
      }
    });
    if (v.phase === 'ended') {
      v.players.forEach((p, i) => { p.vp = points(s, i, true); });
    }
    return v;
  }

  return {
    RES, RES_FR, DEV_FR, TERRAIN_RES, COLORS, COLOR_FR, COST, LIMITS, WIN_POINTS,
    newGame, boardFromSeed, apply, available, targetsFor, actors, viewFor,
    points, total, longestRoadOf, tradeRatios,
    legalSettlements, legalCities, legalRoads,
  };
});

      brokers: () => links.filter((l) => l.up).map((l) => l.broker.url),
      connected: anyUp,
      onConnection(h) { connHandlers.add(h); Promise.resolve().then(() => h(anyUp())); return () => connHandlers.delete(h); },
      async emit(topic, data) {
        if (!anyUp()) return;
        send(publishPacket(base + '/e/' + topic, enc.encode(JSON.stringify({ p: peerId, n: ++seq, d: data })), false));

      _drop() { shutdown(); links.forEach((l) => { try { l.ws && l.ws.close(); } catch (e) { /* ignore */ } }); },

  }

});

//  - chaque appareil a une identité ECDH (P-256) ; sa clé publique voyage dans sa présence,
//    que la plateforme estampille : personne ne peut la publier à la place d'un autre ;
//  - hôte et téléphone en dérivent une clé AES-GCM commune ; tout message de jeu est chiffré ;
//  - la plateforme limite un message à 4 Kio : les messages sont découpés en morceaux.

    const str = await seal(key, obj);
    const m = randomId();
    const n = Math.max(1, Math.ceil(str.length / CHUNK));
    for (let i = 0; i < n; i++) await room.emit(topic, { m, i, n, to, d: str.slice(i * CHUNK, (i + 1) * CHUNK) });
  }

  class Assembler {
    constructor() { this.parts = new Map(); }
    push(peer, data) {
      if (!data || typeof data.d !== 'string' || !Number.isInteger(data.i) || !Number.isInteger(data.n) || data.n < 1 || data.n > 64 || data.i < 0 || data.i >= data.n) return null;
      const now = Date.now();
      for (const [k, v] of this.parts) if (now - v.t > 30000) this.parts.delete(k);
      const k = peer + ':' + data.m;
      let e = this.parts.get(k);
      if (!e) { e = { t: now, n: data.n, got: new Map() }; this.parts.set(k, e); }
      e.got.set(data.i, data.d);
      if (e.got.size < e.n) return null;
      this.parts.delete(k);
      let s = '';
      for (let i = 0; i < e.n; i++) s += e.got.get(i);
      return s;
    }
  }

  const playersOf = (room) => room.peers().filter((p) => !p.isMe && p.presence && p.presence.r === 'p' && typeof p.presence.pub === 'string');

  // ---------- Hôte (l'écran du plateau) ----------
  // opts : room, identity, viewOf(seat) -> JSON, onAct(seat, action) -> message d'erreur | null, onLobby()
  function createHost(opts) {
    const room = opts.room;
    const keys = new Map();
    const lastN = new Map();
    const lastSent = new Map();
    const asm = new Assembler();
    let seats = Object.assign({}, opts.seats || {});
    let version = opts.version || 0;
    let status = 'lobby';
    let actorPub = null;
    const seen = [];
    const noteSeen = () => playersOf(room).forEach((p) => { if (!seen.includes(p.presence.pub)) seen.push(p.presence.pub); });
    let chain = Promise.resolve();
    const q = (fn) => { chain = chain.then(fn).catch(() => {}); return chain; };

    room.presence({ r: 'h', pub: opts.identity.pub, v: version, st: status });

    const keyFor = (pub) => {
      if (!keys.has(pub)) keys.set(pub, deriveKey(opts.identity.priv, pub));
      return keys.get(pub);
    };
    async function toPeer(peer, payload) {
      const pub = peer.presence.pub;
      await emitSealed(room, TOPIC_VIEW, await keyFor(pub), payload, fp(pub));
    }
    async function sendView(peer) {
      const seat = seats[peer.presence.pub];
      lastSent.set(peer.peer, Date.now());
      if (seat === undefined) {
        if (status === 'play') await toPeer(peer, { k: 'full' });
        else await toPeer(peer, { k: 'wait', n: playersOf(room).length });
        return;
      }
      await toPeer(peer, { k: 'view', v: version, seat, view: opts.viewOf(seat) });
    }

    const offPeers = room.onPeers((ch) => {
      noteSeen();
      if (opts.onLobby) opts.onLobby();
      const fresh = new Set(ch.joined.map((p) => p.peer));
      [...ch.joined, ...ch.updated].forEach((p) => {
        if (p.isMe || !p.presence || p.presence.r !== 'p' || typeof p.presence.pub !== 'string') return;
        const stale = p.presence.v !== version && Date.now() - (lastSent.get(p.peer) || 0) > 1500;
        if (fresh.has(p.peer) || stale) q(() => sendView(p));
      });
    });

    // Filet de sécurité : un message perdu n'est pas rejoué. Tout téléphone en retard sur la version reçoit sa vue à nouveau.
    const resync = setInterval(() => {
      playersOf(room).forEach((p) => {
        if (Date.now() - (lastSent.get(p.peer) || 0) < 2500) return;
        const behind = seats[p.presence.pub] !== undefined ? p.presence.v !== version : status === 'play' || p.presence.v !== -1;
        if (behind) q(() => sendView(p));
      });
    }, 3000);
    if (resync.unref) resync.unref();

    const offAct = room.on(TOPIC_ACT, (msg) => {
      if (msg.isMe) return;
      const peer = room.peers().find((p) => p.peer === msg.peer);
      if (!peer || !peer.presence || peer.presence.r !== 'p' || typeof peer.presence.pub !== 'string') return;
      const pub = peer.presence.pub;
      if (seats[pub] === undefined) return;
      const text = asm.push(msg.peer, msg.data);
      if (!text) return;
      q(async () => {
        let payload;
        try { payload = await open(await keyFor(pub), text); } catch (e) { return; }
        if (!payload || !(payload.n > (lastN.get(pub) || 0)) || !payload.action) return;
        lastN.set(pub, payload.n);
        actorPub = pub;
        const err = opts.onAct(seats[pub], payload.action);
        actorPub = null;
        if (err) {
          await toPeer(peer, { k: 'err', n: payload.n, error: err });
          await sendView(peer); // annule l'affichage anticipé du téléphone
        }
      });
    });

    return {
      setSeats(map) { seats = Object.assign({}, map); },
      seats: () => Object.assign({}, seats),
      // Ceux qui sont là maintenant, dans l'ordre d'arrivée.
      lobby: () => (noteSeen(), playersOf(room)
        .slice()
        .sort((a, b) => seen.indexOf(a.presence.pub) - seen.indexOf(b.presence.pub))
        .map((p) => ({ peer: p.peer, pub: p.presence.pub, name: String(p.presence.name || 'Joueur').slice(0, 14), seat: seats[p.presence.pub] }))),
      setStatus(st) {
        status = st;
        room.presence({ st });
        playersOf(room).forEach((p) => q(() => sendView(p)));
      },
      publish() {
        version++;
        room.presence({ v: version });
        const first = actorPub; // celui qui vient d'agir est servi en premier
        playersOf(room)
          .filter((p) => seats[p.presence.pub] !== undefined)
          .sort((a, b) => (b.presence.pub === first) - (a.presence.pub === first))
          .forEach((p) => q(() => sendView(p)));
      },
      version: () => version,
      close() { clearInterval(resync); offPeers(); offAct(); room.presence({ r: null, pub: null, v: null, st: null }); },
    };
  }

  // ---------- Client (le téléphone) ----------
  // opts : room, identity, name, onView(payload), onStatus(status, info), onError(text)
  function createClient(opts) {
    const room = opts.room;
    const asm = new Assembler();
    let hostKey = null, hostPeer = null, hostPub = null, lastV = -1, counter = Date.now();
    let status = '';
    const set = (s, info) => { if (s !== status || info) { status = s; opts.onStatus(s, info || {}); } };

    room.presence({ r: 'p', name: opts.name, pub: opts.identity.pub, v: -1 });
    set('searching');

    function scan() {
      const host = room.peers().find((p) => !p.isMe && p.presence && p.presence.r === 'h' && typeof p.presence.pub === 'string');
      if (!host) {
        if (hostPeer) { hostPeer = null; hostKey = null; hostPub = null; }
        set('searching');
        return;
      }
      if (host.peer !== hostPeer || host.presence.pub !== hostPub) {
        hostPeer = host.peer;
        if (host.presence.pub !== hostPub) { hostPub = host.presence.pub; lastV = -1; hostKey = null; }
        deriveKey(opts.identity.priv, hostPub).then((k) => { hostKey = k; }).catch(() => {});
        room.presence({ v: -1 });
        set('found');
      }
    }
    // Écran trouvé mais rien reçu : on relance la demande (un changement de présence réveille l'hôte).
    let nudge = 0;
    const nudger = setInterval(() => { if (status === 'found') room.presence({ n: ++nudge }); }, 3000);
    if (nudger.unref) nudger.unref();

    const offPeers = room.onPeers(() => { scan(); if (opts.onLobby) opts.onLobby(playersOf(room).concat(room.peers().filter((p) => p.isMe)).map((p) => String(p.presence.name || 'Joueur').slice(0, 14))); });
    scan();

    const offView = room.on(TOPIC_VIEW, (msg) => {
      if (msg.isMe || msg.peer !== hostPeer || !msg.data || msg.data.to !== fp(opts.identity.pub)) return;
      const text = asm.push(msg.peer, msg.data);
      if (!text) return;
      const tryOpen = async () => {
        for (let i = 0; i < 20 && !hostKey; i++) await new Promise((r) => setTimeout(r, 50));
        if (!hostKey) return;
        let p;
        try { p = await open(hostKey, text); } catch (e) { return; }
        if (!p) return;
        if (p.k === 'view') {
          if (p.v < lastV) return;
          lastV = p.v;
          room.presence({ v: p.v });
          set('playing');
          opts.onView(p);
        } else if (p.k === 'wait') set('lobby', { count: p.n });
        else if (p.k === 'full') set('full');
        else if (p.k === 'err') opts.onError(p.error, p.n);
      };
      tryOpen();
    });

    return {
      async send(action) {
        if (!hostKey) throw new Error('hors ligne');
        const n = ++counter;
        await emitSealed(room, TOPIC_ACT, hostKey, { n, action }, fp(hostPub || ''));
        return n;
      },
      status: () => status,
      // Redemande la vue à l'hôte (l'affichage anticipé n'a pas été confirmé).
      resync() { room.presence({ v: -1, n: ++nudge }); },
      close() { clearInterval(nudger); offPeers(); offView(); room.presence({ r: null, pub: null, name: null, v: null, n: null }); },
    };
  }

  return { available, newIdentity, restoreIdentity, createHost, createClient, seal, open, deriveKey, emitSealed, Assembler, fp };
});

<script>
// Interface. Aucune règle ici : tout vient de Engine.available / targetsFor / apply.
// Trois modes : « local » (un seul écran), « host » (écran du plateau) et « client » (téléphone).
(function () {
  'use strict';

  const zero = () => ({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 });

  const bundle = (b) => '<span class="bundle">' + RES.filter((r) => b[r]).map((r) => b[r] + icon(r, 'mini')).join(' ') + '</span>';

  const cardsOf = (p) => (p.hand ? E.total(p.hand) : p.handCount);
  const devOf = (p) => (p.dev ? p.dev.length : p.devCount);
  const deckOf = (s) => (s.devDeck ? s.devDeck.length : s.devDeckCount);
  const finalPts = (s, i) => (s.players[i].dev ? E.points(s, i, true) : s.players[i].vp);

  let mode = 'menu';       // menu | local | host | client
  let game = null;         // état complet (local, host) ou vue du joueur + plateau (client)
  let hostNet = null, clientNet = null, activeRoom = null;
  const ui = {
    screen: 'menu', pin: null, mode: null, tradeOpen: false, tab: 'bank', bankGive: null, bankGet: null,
    give: zero(), want: zero(), discard: zero(), pick: null, yop: [], toast: '', confirmNew: false,
    count: 3, names: ['Alice', 'Bruno', 'Chloé', 'David'], diceKey: null, diceAt: 0, orderSeen: null, stageTimer: 0, pieces: null, news: [], newsNow: [], newsTimer: 0, lastTurn: -1, fxKey: null, fx: null, fxNow: null, fxTimer: 0, gain: null, gainTimer: 0, lastHand: null,
    code: '', joinCode: '', myName: '', error: '', busy: false,
    seat: -1, boardSeed: null, board: null, conn: 'searching', lobby: [], pending: 0, phoneTab: 'hand', needBoard: false, wasNeed: false, wasMine: false,
  };
  let toastTimer = 0;

  // ---------- Stockage local ----------
  const store = {
    get(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  const slim = (g) => Object.assign({}, g, { board: undefined });
  const fat = (g) => { if (g && !g.board) g.board = E.boardFromSeed(g.seed); return g; };
  const validGame = (g) => g && g.players && (g.board || g.seed != null);
  function save() {
    if (mode === 'local') store.set(SAVE_KEY, slim(game));
    else if (mode === 'host') store.set(HOST_KEY, { game: slim(game), seats: hostNet.seats(), code: ui.code });
  }

  // ---------- Actions ----------
  function dispatch(action) {
    if (mode === 'client') return sendFromPhone(action);
    const r = E.apply(game, action);
    if (!r.ok) { say(r.error); return false; }
    game = r.state;
    afterAction(action);
    save();
    render();
    return true;
  }
  function afterAction(action) {
    ui.mode = null;
    ui.pick = null;
    ui.yop = [];
    ui.discard = zero();
    if (action.type === 'bankTrade') { ui.bankGive = null; ui.bankGet = null; }
    else if (action.type === 'offerTrade') { ui.give = zero(); ui.want = zero(); }
    else if (!/Trade$/.test(action.type)) ui.tradeOpen = false;
  }
  function say(msg) {
    ui.toast = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { ui.toast = ''; renderHand(); }, 3500);
    renderHand();
  }
  // Actions que le téléphone peut montrer tout de suite : elles ne dépendent d'aucun secret (dés, pioche, main des autres).
  // L'hôte tranche ; sa vue remplace de toute façon l'affichage anticipé.
  const ANTICIPATED = new Set(['pickColor', 'placeSettlement', 'placeRoad', 'placeCity', 'endTurn', 'bankTrade', 'discard', 'offerTrade', 'cancelTrade', 'respondTrade']);
  function anticipate(action) {
    if (!ANTICIPATED.has(action.type)) return;
    try {
      const r = E.apply(game, Object.assign({}, action, { player: ui.seat }));
      if (r.ok) { r.state.board = ui.board; game = r.state; }
    } catch (e) { /* vue incomplète : on attend l'hôte */ }
  }
  function sendFromPhone(action) {
    if (!clientNet || !game) return false;
    const id = ++ui.pending;
    afterAction(action);
    anticipate(action);
    clientNet.send(Object.assign({}, action, { player: ui.seat })).catch(() => { ui.pending = 0; say('Écran hors ligne.'); });
    setTimeout(() => { if (ui.pending === id) { ui.pending = 0; clientNet.resync(); say('L\'écran n\'a pas répondu, resynchronisation…'); } }, 4000);
    render();
    return true;
  }

  const myPid = () => (mode === 'client' ? ui.seat : game.turn);
  function viewer() {
    if (mode === 'client') return ui.seat;
    if (ui.pin != null && ui.pin < game.players.length) return ui.pin;
    const a = E.actors(game);
    return a.length ? a[0] : game.turn;
  }

  // ---------- Plateau ----------
  const X = (v) => Math.round(v * S * 10) / 10;

  function boardHTML() {

    const out = [];
    out.push('<ellipse cx="0" cy="0" rx="530" ry="490" fill="var(--sea)" stroke="var(--sea-edge)" stroke-width="6"/><ellipse cx="0" cy="0" rx="530" ry="490" fill="url(#waves)"/><ellipse cx="0" cy="0" rx="530" ry="490" fill="url(#seagrad)"/>');

    b.ports.forEach((p) => {

      [p.a, p.b].forEach((v) => {
        out.push('<line x1="' + bx + '" y1="' + by + '" x2="' + X(b.vertices[v].x) + '" y2="' + X(b.vertices[v].y) + '" stroke="var(--pier)" stroke-width="7" stroke-linecap="round"/>');
      });
      const generic = p.type === 'any';
      out.push('<g transform="translate(' + bx + ' ' + by + ')"><circle r="29" fill="var(--surface)" stroke="var(--pier)" stroke-width="4"/>' +

          : '<use href="#g-' + p.type + '" x="-13" y="-25" width="26" height="26"/><text y="20" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)" font-family="var(--f-display)">2:1</text>') +

      out.push('<g transform="translate(' + cx + ' ' + cy + ')"><g clip-path="url(#hexclip)"><g transform="scale(1)' + flip + '"><use href="#t-' + h.terrain + '"/></g><rect x="-100" y="-100" width="200" height="200" fill="url(#hexshade)"/></g>' +
        '<polygon points="86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50 0,-100" transform="scale(.94)" fill="none" stroke="#1b2a30" stroke-opacity=".18" stroke-width="2.4" stroke-linejoin="round"/></g>');
      out.push('<polygon points="' + pts + '" fill="none" stroke="#fffaf0" stroke-width="5.5" stroke-linejoin="round"/>');

        out.push('<circle cx="' + cx + '" cy="' + (cy - 46) + '" r="21" fill="#fffaf0" fill-opacity=".92"/><use href="#g-' + g + '" x="' + (cx - 18) + '" y="' + (cy - 64) + '" width="36" height="36"/>');
