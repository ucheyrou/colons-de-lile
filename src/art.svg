<!-- Scènes des tuiles : hexagone de rayon 100 centré sur l'origine. Chaque scène est rognée par #hexclip. -->
<clipPath id="hexclip"><polygon points="86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50 0,-100"/></clipPath>

<linearGradient id="gr-forest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa064"/><stop offset="1" stop-color="#3b7a49"/></linearGradient>
<linearGradient id="gr-pasture" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4e690"/><stop offset="1" stop-color="#94c45d"/></linearGradient>
<linearGradient id="gr-fields" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6da75"/><stop offset="1" stop-color="#dfb24a"/></linearGradient>
<linearGradient id="gr-hills" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a077"/><stop offset="1" stop-color="#c1653d"/></linearGradient>
<linearGradient id="gr-mountains" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d0da"/><stop offset="1" stop-color="#8d97a6"/></linearGradient>
<linearGradient id="gr-desert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e6b9"/><stop offset="1" stop-color="#dcc684"/></linearGradient>
<radialGradient id="hexshade" cx="0.5" cy="0.4" r="0.75"><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1b2a30" stop-opacity=".22"/></radialGradient>
<radialGradient id="tokengrad" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#fffef9"/><stop offset="1" stop-color="#eadfc4"/></radialGradient>
<radialGradient id="seagrad" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="furrow" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><path d="M0 8H16" stroke="#c4902a" stroke-width="3.2" opacity=".5"/><path d="M0 12.5H16" stroke="#fff3bb" stroke-width="1.6" opacity=".4"/></pattern>
<pattern id="waves" width="54" height="28" patternUnits="userSpaceOnUse"><path d="M0 14q13.5-11 27 0t27 0" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2.6" stroke-linecap="round"/></pattern>

<!-- Éléments réutilisables -->
<g id="pine">
  <rect x="-2.6" y="-3" width="5.2" height="9" fill="#5b3a22"/>
  <path d="M0-60 15-31H-15Z" fill="#2b6a3b"/><path d="M0-44 19-13H-19Z" fill="#32794a"/><path d="M0-27 23 2H-23Z" fill="#3b8a55"/>
  <path d="M0-60 15-31H3Z M0-44 19-13H4Z M0-27 23 2H5Z" fill="#fff" opacity=".13"/>
</g>
<g id="lamb">
  <rect x="-6.5" y="6" width="2.4" height="6" fill="#33392a"/><rect x="4" y="6" width="2.4" height="6" fill="#33392a"/>
  <ellipse cx="14" cy="-1" rx="4.6" ry="4" fill="#33392a"/>
  <ellipse cx="0" cy="0" rx="12" ry="8" fill="#fff"/><circle cx="-7" cy="-3" r="5.2" fill="#fff"/><circle cx="-1" cy="-6.5" r="5.8" fill="#fff"/><circle cx="6" cy="-3.5" r="5" fill="#fff"/>
  <ellipse cx="0" cy="5" rx="11" ry="3" fill="#000" opacity=".06"/>
</g>
<g id="tuft">
  <path d="M0 0V-26M-6 0-10-22M6 0 10-22" stroke="#9a6d12" stroke-width="2" stroke-linecap="round" fill="none"/>
  <g fill="#f9e38f" stroke="#b98a1c" stroke-width=".9">
    <ellipse cx="0" cy="-30" rx="3" ry="6"/><ellipse cx="-10.5" cy="-26" rx="2.8" ry="5.4" transform="rotate(-14 -10.5 -26)"/><ellipse cx="10.5" cy="-26" rx="2.8" ry="5.4" transform="rotate(14 10.5 -26)"/>
  </g>
</g>
<g id="bale"><circle r="8.5" fill="#ebc45c" stroke="#a97c1c" stroke-width="1.4"/><path d="M0 0m-3 0a3 3 0 1 1 3 3" fill="none" stroke="#a97c1c" stroke-width="1.2"/></g>
<g id="brickpile">
  <g fill="#93421f" stroke="#e8b095" stroke-width=".9">
    <rect x="-16" y="-4" width="10" height="6" rx="1"/><rect x="-5" y="-4" width="10" height="6" rx="1"/><rect x="6" y="-4" width="10" height="6" rx="1"/>
    <rect x="-10.5" y="-11" width="10" height="6" rx="1"/><rect x=".5" y="-11" width="10" height="6" rx="1"/>
    <rect x="-5" y="-18" width="10" height="6" rx="1"/>
  </g>
</g>
<g id="cactus">
  <rect x="-4" y="-26" width="8" height="30" rx="4" fill="#4e8a4a"/>
  <path d="M-4-10H-11a4 4 0 0 1-4-4V-20" fill="none" stroke="#4e8a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4-6H11a4 4 0 0 0 4-4V-16" fill="none" stroke="#4e8a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-1-26V0" stroke="#7bb274" stroke-width="1.6" opacity=".7"/>
</g>
<g id="flower"><circle r="2.6" fill="#fff7cf"/><circle r="1" fill="#f0b43c"/></g>

